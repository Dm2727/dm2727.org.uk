<style>
:root { --bg:#0b0c0d; --panel:#111214; --panel2:#1a1b1e; --border:#2a2d33; --accent:#8fe3b8; --accent2:#86d4dc; --text:#d0d8f0; --muted:#7480a8; --inset:#0b0c0d; --inset2:#151618; }
* { box-sizing: border-box; }
html { background: var(--bg); }
html[data-theme="aero"] body { background-image: linear-gradient(135deg,#8fc1e8 0%,#d6eaf8 45%,#a9d3f0 100%); }
body { margin: 0; padding: 14px 10px; min-height: 100vh; background: var(--bg); color: var(--text);
  font: 11px 'Open Sans', system-ui, sans-serif; display: flex; justify-content: center; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 8px; }
.sec { background: var(--panel2); border: 1px solid var(--border); border-radius: 2px; padding: 4px; }

#list { display: none; flex-direction: column; gap: 4px; }
.vt { width: 100%; border-collapse: collapse; }
.vt th { padding: 4px 10px; text-align: left; font-weight: 400; font-size: 9px; letter-spacing: 1.5px; color: var(--muted); border-bottom: 1px solid var(--border); }
.vt td { padding: 5px 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
.vt tr:last-child td { border-bottom: 0; }
.vt th:last-child, .vt td:last-child { text-align: right; }
.vrow { cursor: pointer; }
.vrow:hover td { background: var(--inset2); }
.vrow a { color: var(--text); text-decoration: none; font-size: 12px; }
.vrow a span { color: var(--accent2); }
.vrow a:focus-visible { outline: 1px solid var(--accent2); outline-offset: 2px; }
.vtag { display: none; margin-left: 6px; font-size: 10px; color: var(--accent); }
.vrow.latest .vtag { display: inline; }
.vrow.latest td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.vrow .d { font-size: 10px; color: var(--text); }
.vrow .d.off { color: var(--muted); }

#loading, #error { display: none; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; text-align: center; }
.pw-spin { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.t { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
.s { font-size: 9px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; line-height: 1.5; }
.codeblock { display: block; width: 100%; padding: 6px 10px; text-align: left; background: var(--inset); border: 1px solid var(--border); border-radius: 2px;
  font: 10px 'Open Sans', system-ui, sans-serif; color: var(--text); white-space: pre-wrap; word-break: break-word; user-select: all; }
.vbtn { background: transparent; border: 1px solid var(--accent2); border-radius: 2px; color: var(--accent2);
  font: 10px 'Open Sans', system-ui, sans-serif; letter-spacing: 1px; text-transform: uppercase; padding: 4px 12px; cursor: pointer; }
.vbtn:hover { background-color: color-mix(in srgb, var(--accent2) 18%, transparent); }
</style>

border":"#3c3c3c","accent":"#0078d7","accent2":"#00b4ff","text":"#ffffff","muted":"#8a8a8a","inset":"#111111","inset2":"#181818"},"mica":{"bg":"#1c1c1c","panel":"#2b2b2b","panel2":"#323232","border":"#3d3d3d","accent":"#60cdff","accent2":"#99ebff","text":"#f3f3f3","muted":"#9d9d9d","inset":"#1f1f1f","inset2":"#262626"}};
  var LEGACY = {'dark-orange':'citrus','dark-gray':'pale','dark-blue':'navy','light-purple':'default','light-black':'default','light-red':'default'};
  var LIGHT = ['old-classic','luna','aero'];
  function apply(){
    var name = 'default';
    try { name = JSON.parse(localStorage.getItem('sirenosc_ui_settings') || '{}').theme || 'default'; } catch (e) {}
    name = LEGACY[name] || name;
    if (!T[name]) name = 'default';
    var r = document.documentElement;
    for (var k in T[name]) r.style.setProperty('--' + k, T[name][k]);
    r.setAttribute('data-theme', name);
    r.style.colorScheme = LIGHT.indexOf(name) >= 0 ? 'light' : 'dark';
  }
  apply();
  window.addEventListener('storage', function(e){ if (e.key === 'sirenosc_ui_settings') apply(); });
})();
</script>

<div class="wrap">

    <div id="loading"><div class="pw-spin"></div><div class="t">Please Wait...</div></div>

  </div>

<script>
// where to look for version folders (vX.Y.Z); update this when cloning the git
const API = "https://api.github.com/repos/aphidaks/aphidaks/contents/sirenosc";
// where the version folders live on the site (this page is at /sirenosc/version-picker/)
const BASE = "/sirenosc/";

const $ = id => document.getElementById(id);
const cmp = (a, b) => {
  const pa = a.slice(1).split(".").map(Number);
  const pb = b.slice(1).split(".").map(Number);
  for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pb[i] - pa[i];
  return 0;
};

// null = could not reach the list, [] = reached it but no versions in it
async function discoverVersions() {
  try {
    const res = await fetch(API, { cache: "no-store" });
    if (!res.ok) return null;
    const items = await res.json();
    return items
      .filter(i => i.type === "dir" && /^v\d+\.\d+\.\d+$/.test(i.name))
      .map(i => i.name);
  } catch (e) {
    return null;
  }
}

async function hasLatest(version) {
  try {
    const res = await fetch(`${BASE}${version}/latest`, { cache: "no-store" });
    return res.ok;
  } catch (e) {
    return false;
  }
}

// release date from timestamp.txt in that version's folder (YYYY-MM-DD, e.g. 2026-10-01)
async function getDate(version) {
  try {
    const res = await fetch(`${BASE}${version}/timestamp.txt`, { cache: "no-store" });
    if (!res.ok) return null;
    const t = (await res.text()).replace(/^\uFEFF/, "").trim();
    return /^\d{4}-\d{2}-\d{2}$/.test(t) ? t : null;
  } catch (e) {
    return null;
  }
}

function show(which) {
  $("loading").style.display = which === "loading" ? "flex" : "none";
  $("error").style.display   = which === "error"   ? "flex" : "none";
  $("list").style.display    = which === "list"    ? "flex" : "none";
}

function showError(title, sub) {
  $("errTitle").textContent = title;
  $("errSub").textContent = sub;
  show("error");
}

function renderRows(versions) {
  const rows = $("rows");
  rows.textContent = "";
  for (const v of versions) {                       // v is validated as vX.Y.Z above
    const tr = document.createElement("tr");
    tr.className = "vrow";
    tr.dataset.v = v;
    tr.innerHTML =
      `<td><a href="${BASE}${v}/">Siren<span>Osc</span> V${v.slice(1)}</a><span class="vtag">(Latest)</span></td>` +
      `<td class="d off">…</td>`;
    rows.appendChild(tr);
  }
}

// the whole row is clickable; the link inside keeps it keyboard accessible
$("rows").addEventListener("click", e => {
  const tr = e.target.closest(".vrow");
  if (tr && !e.target.closest("a")) location.href = `${BASE}${tr.dataset.v}/`;
});

async function load() {
  show("loading");
  const versions = await discoverVersions();
  if (versions === null) {
    showError("Couldn't load versions",
      "GitHub may be rate limiting this network. Try again in a bit.");
    return;
  }
  if (!versions.length) {
    showError("No versions found", "Nothing to show yet.");
    return;
  }
  versions.sort(cmp);
  renderRows(versions);
  show("list");

  // release dates fill in as they arrive
  versions.forEach(async v => {
    const d = await getDate(v);
    const el = document.querySelector(`.vrow[data-v="${v}"] .d`);
    if (!el) return;
    el.textContent = d || "Unknown";
    el.classList.toggle("off", !d);
  });

  // newest version that has a "latest" marker is the Latest; if none do, the highest version is
  const flags = await Promise.all(versions.map(hasLatest));
  const idx = flags.indexOf(true);
  const latest = versions[idx === -1 ? 0 : idx];
  const row = document.querySelector(`.vrow[data-v="${latest}"]`);
  if (row) row.classList.add("latest");
}

$("retry").addEventListener("click", load);
load();
</script>
</body>
</html>
