<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dm2727 - Character Counter</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #000;
        color: #fff;
        font-family: Open Sans, sans-serif;
    }

    h1 {
        text-align: center;
    }

    textarea {
        width: 100%;
        height: 350px;
        background: #111;
        color: #fff;
        border: 2px solid #444;
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
        resize: vertical;
        outline: none;
    }

    textarea:focus {
        border-color: #fff;
    }

    .stats {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
    }

    .card {
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
    }

    .number {
        font-size: 28px;
        font-weight: bold;
        margin-top: 5px;
    }

    button {
        margin-top: 15px;
        padding: 10px 20px;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #ddd;
    }
</style>
</head>
<body>

<h1>Character Counter</h1>

<textarea id="textInput" placeholder="Type or paste text here..."></textarea>

<br>
<button onclick="copyText()">Copy Text</button>

<div class="stats">
    <div class="card">
        <div>Total Characters</div>
        <div class="number" id="chars">0</div>
    </div>

    <div class="card">
        <div>Letters</div>
        <div class="number" id="letters">0</div>
    </div>

    <div class="card">
        <div>Spaces</div>
        <div class="number" id="spaces">0</div>
    </div>

    <div class="card">
        <div>Words</div>
        <div class="number" id="words">0</div>
    </div>
</div>

<script>
const textInput = document.getElementById("textInput");

function updateCounts() {
    const text = textInput.value;

    const totalChars = text.length;
    const letters = (text.match(/[A-Za-z]/g) || []).length;
    const spaces = (text.match(/ /g) || []).length;
    const words = text.trim() === ""
        ? 0
        : text.trim().split(/\s+/).length;

    document.getElementById("chars").textContent = totalChars;
    document.getElementById("letters").textContent = letters;
    document.getElementById("spaces").textContent = spaces;
    document.getElementById("words").textContent = words;
}

function copyText() {
    navigator.clipboard.writeText(textInput.value);
}

textInput.addEventListener("input", updateCounts);
updateCounts();
</script>

</body>
</html>
